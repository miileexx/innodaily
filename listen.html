<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>InnoNews · Audio Summary</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f3;
      color: #1f2a44;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .player {
      width: 100%;
      max-width: 620px;
      background: #ffffff;
      border: 1px solid #f1eadf;
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 12px 40px rgba(31,42,68,.08);
    }

    .top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #fff4df;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .brand {
      font-size: 11px;
      line-height: 14px;
      font-weight: 700;
      color: #b26b00;
      text-transform: uppercase;
      letter-spacing: .9px;
    }

    .subbrand {
      font-size: 13px;
      color: #8a8f98;
      margin-top: 2px;
    }

    h1 {
      margin: 0 0 14px 0;
      font-size: 24px;
      line-height: 31px;
      color: #1f2a44;
    }

    .summary {
      font-size: 15px;
      line-height: 23px;
      color: #556070;
      margin-bottom: 24px;
    }

    .status-box {
      background: #fffaf2;
      border: 1px solid #f1eadf;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 18px;
    }

    .status {
      font-size: 13px;
      font-weight: 700;
      color: #b26b00;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #f5a000;
      color: #ffffff;
    }

    .secondary {
      background: #fff4df;
      color: #a76500;
    }

    .hint {
      margin-top: 16px;
      font-size: 11px;
      line-height: 16px;
      color: #98a0ad;
    }

    @media screen and (max-width: 600px) {
      .player {
        padding: 22px;
      }

      h1 {
        font-size: 21px;
        line-height: 28px;
      }
    }
  </style>
</head>

<body>

  <div class="player">

    <div class="top">

      <div class="icon">
        🔊
      </div>

      <div>
        <div class="brand">
          InnoNews Daily
        </div>

        <div class="subbrand">
          Audio summary
        </div>
      </div>

    </div>

    <h1 id="title">
      Loading...
    </h1>

    <div id="summary" class="summary">
      Loading summary...
    </div>

    <div class="status-box">
      <div id="status" class="status">
        Preparing audio...
      </div>
    </div>

    <div class="controls">

      <button
        id="playButton"
        class="primary"
        onclick="playSpeech()">
        ▶ Play
      </button>

      <button
        class="secondary"
        onclick="pauseSpeech()">
        ⏸ Pause
      </button>

      <button
        class="secondary"
        onclick="resumeSpeech()">
        ▶ Resume
      </button>

      <button
        class="secondary"
        onclick="stopSpeech()">
        ■ Stop
      </button>

    </div>

    <div id="hint" class="hint">
      InnoNews uses your browser's text-to-speech engine. No additional AI generation is used.
    </div>

  </div>


  <script>

    const params = new URLSearchParams(window.location.search);

    const title =
      params.get("title") ||
      "InnoNews summary";

    const summary =
      params.get("text") ||
      "No summary was provided.";

    const lang =
      params.get("lang") ||
      "en-US";


    document.getElementById("title").textContent = title;
    document.getElementById("summary").textContent = summary;


    let utterance = null;


    function createUtterance() {

      utterance =
        new SpeechSynthesisUtterance(summary);

      utterance.lang = lang;

      utterance.rate = 1;
      utterance.pitch = 1;
      utterance.volume = 1;


      utterance.onstart = function() {

        document.getElementById("status").textContent =
          "🔊 Playing summary...";

        document.getElementById("playButton").textContent =
          "↻ Restart";

      };


      utterance.onend = function() {

        document.getElementById("status").textContent =
          "✓ Summary finished";

        document.getElementById("playButton").textContent =
          "▶ Play again";

      };


      utterance.onerror = function() {

        document.getElementById("status").textContent =
          "▶ Tap Play to listen";

      };

    }


    function playSpeech() {

      speechSynthesis.cancel();

      createUtterance();

      speechSynthesis.speak(utterance);

    }


    function pauseSpeech() {

      if (speechSynthesis.speaking && !speechSynthesis.paused) {

        speechSynthesis.pause();

        document.getElementById("status").textContent =
          "⏸ Summary paused";

      }

    }


    function resumeSpeech() {

      if (speechSynthesis.paused) {

        speechSynthesis.resume();

        document.getElementById("status").textContent =
          "🔊 Playing summary...";

      }

    }


    function stopSpeech() {

      speechSynthesis.cancel();

      document.getElementById("status").textContent =
        "■ Playback stopped";

      document.getElementById("playButton").textContent =
        "▶ Play";

    }


    /*
      Try to start automatically.

      Some browsers permit this because the page was opened
      directly from a user click in the email.

      Others may block speech autoplay.
      In that case the Play button remains available.
    */

    window.addEventListener("load", function() {

      setTimeout(function() {

        try {

          playSpeech();

        } catch (error) {

          document.getElementById("status").textContent =
            "▶ Tap Play to listen";

        }

      }, 350);

    });


    window.addEventListener("beforeunload", function() {

      speechSynthesis.cancel();

    });

  </script>

</body>
</html>
