<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>InnoNews · Escuchar resumen</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f8;
      color: #202124;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .player {
      width: 100%;
      max-width: 720px;
      background: white;
      border-radius: 22px;
      padding: 34px;
      box-shadow: 0 10px 40px rgba(0,0,0,.08);
    }

    .brand {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .8px;
      color: #777;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 27px;
      line-height: 1.25;
      margin: 0 0 16px;
    }

    .summary {
      color: #555;
      font-size: 17px;
      line-height: 1.65;
      margin-bottom: 28px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .play {
      background: #111;
      color: white;
    }

    .secondary {
      background: #eceff3;
      color: #222;
    }

    .status {
      margin-top: 20px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>

<div class="player">

  <div class="brand">
    INNONEWS DAILY
  </div>

  <h1 id="title">
    Resumen de noticia
  </h1>

  <div id="summary" class="summary">
    Cargando resumen...
  </div>

  <div class="controls">

    <button class="play" onclick="playSpeech()">
      ▶ Escuchar resumen
    </button>

    <button class="secondary" onclick="pauseSpeech()">
      ⏸ Pausar
    </button>

    <button class="secondary" onclick="resumeSpeech()">
      ▶ Continuar
    </button>

    <button class="secondary" onclick="stopSpeech()">
      ■ Detener
    </button>

  </div>

  <div id="status" class="status">
    Listo para reproducir
  </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);

const title =
  params.get("title") ||
  "Resumen de noticia";

const summary =
  params.get("text") ||
  "No se encontró un resumen.";

document.getElementById("title").textContent = title;
document.getElementById("summary").textContent = summary;

let utterance = null;


function playSpeech() {

  speechSynthesis.cancel();

  utterance = new SpeechSynthesisUtterance(summary);

  utterance.rate = 1;
  utterance.pitch = 1;
  utterance.volume = 1;

  /*
     Detección sencilla:
     si en el futuro quieres que InnoNews
     lea en inglés, podemos mandarle lang=en-US
  */

  const lang = params.get("lang") || "es-MX";

  utterance.lang = lang;

  utterance.onstart = function() {
    document.getElementById("status").textContent =
      "🔊 Reproduciendo resumen...";
  };

  utterance.onend = function() {
    document.getElementById("status").textContent =
      "✓ Reproducción terminada";
  };

  utterance.onerror = function() {
    document.getElementById("status").textContent =
      "No se pudo reproducir el audio.";
  };

  speechSynthesis.speak(utterance);
}


function pauseSpeech() {

  if (speechSynthesis.speaking) {
    speechSynthesis.pause();

    document.getElementById("status").textContent =
      "⏸ Reproducción pausada";
  }

}


function resumeSpeech() {

  if (speechSynthesis.paused) {
    speechSynthesis.resume();

    document.getElementById("status").textContent =
      "🔊 Reproduciendo resumen...";
  }

}


function stopSpeech() {

  speechSynthesis.cancel();

  document.getElementById("status").textContent =
    "■ Reproducción detenida";

}

</script>

</body>
</html>
